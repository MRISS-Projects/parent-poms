name: Verify reactor version
description: >
  Fail unless every module of the Maven reactor in `working-directory` reports the expected
  version. See specs/69-set-hotfix-version-on-every-module.md.

inputs:
  expected-version:
    description: The version every module must carry, e.g. 0.3.1-SNAPSHOT.
    required: true
  working-directory:
    description: The directory holding the reactor root POM. Defaults to the workspace.
    required: false
    default: '.'

runs:
  using: composite
  steps:
    - name: Verify every module carries the expected version
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      # The version reaches the script through the environment rather than being interpolated
      # into the run body, for the same reason maven-properties does it: an input is not a
      # literal until something makes it one.
      env:
        EXPECTED_VERSION: ${{ inputs.expected-version }}
      run: |
        set -euo pipefail

        log="$RUNNER_TEMP/verify-reactor-version.log"

        # validate is the cheapest phase that still builds the model of every module, so the
        # versions it reports are the resolved ones for the whole reactor.
        #
        # PR #80 review: this annotation used to assert that a module "very likely names a
        # parent version that does not exist". That is the one cause the corrected §1.3 says is
        # unlikely — the release-version artifacts are in the local repository in a rehearsal and
        # in the registry in a real release, so a stale parent usually resolves. validate can
        # fail for reasons that have nothing to do with #69 at all. It states what happened and
        # points at the log rather than guessing.
        if ! mvn -B validate > "$log" 2>&1; then
          echo "::error::mvn -B validate failed in $(pwd), so the reactor's versions could not" \
               "be checked. The full log follows."
          cat "$log"
          exit 1
        fi

        summary="$("$GITHUB_ACTION_PATH/assert-reactor-version.sh" "$EXPECTED_VERSION" "$log")"
        echo "$summary"
        echo "- **#69 check** — $summary" >> "$GITHUB_STEP_SUMMARY"
