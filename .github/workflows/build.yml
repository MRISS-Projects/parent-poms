# Build workflow - mirrors ReleaseJenkinsfile operations but without publishing
# artifacts, deploying site to gh-pages, or committing/pushing generated versions.
# Triggered automatically by any push/commit operation.

name: Build

on:
  push:

# Mirrors ReleaseJenkinsfile's disableConcurrentBuilds() - cancel any
# in-progress run on the same branch before starting a new one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # DEPLOY_TOKEN must be stored as a repository secret.
      # Create a GitHub Personal Access Token (classic) with the
      # "read:packages" scope from an account that has read access to the
      # MRISS-Projects organization, then add it to this repo's secrets as
      # DEPLOY_TOKEN (Settings → Secrets and variables → Actions).
      # The auto-generated GITHUB_TOKEN cannot be used here because it is
      # scoped to THIS repository (parent-poms) only; packages published
      # under MRISS-Projects/maven-repo belong to a different repository and
      # require a cross-repository token.
      DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Maven 3.9.9
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: '3.9.9'

      - name: Verify Maven version
        run: |
          mvn -version
          mvn -version | grep -qF 'Apache Maven 3.9.9 ' || {
            echo "::error::Expected Maven 3.9.9. The 'Set up Maven 3.9.9' step did not take effect, so this build would have run the runner image's Maven."
            exit 1
          }

      # #71: the placeholder guard is the one unit-testable piece of the README commit path,
      # so its tests run on every build rather than only when a release exercises it.
      - name: Test the README placeholder guard
        run: sh .github/actions/commit-readme/check-placeholders.test.sh

      # #72: the rehearsal scripts are the other unit-testable pieces of the release path,
      # and a rehearsal is the one thing that never happens on a normal build — so without
      # this their first exercise would be a rehearsal someone dispatched by hand.
      - name: Test the rehearsal scripts
        run: |
          set -euo pipefail
          for t in .github/actions/rehearsal-*/*.test.sh; do
            echo "--- $t"
            sh "$t"
          done

      # #72: every .sh under .github/actions is invoked directly by an action.yml or a
      # workflow step, so it needs git mode 100755. A development box with core.fileMode
      # false — any Windows checkout — commits 100644 silently, and `chmod +x` there changes
      # nothing git records. The failure then lands six minutes into a release as
      # "Permission denied", which is where MRISS-Projects/dsh run 35660420977 found it.
      - name: Check the action scripts are executable
        run: |
          set -euo pipefail
          bad=$(git ls-files -s .github/actions/ | grep -E '\.sh$' | grep -v '^100755 ' || true)
          if [ -n "$bad" ]; then
            echo "::error::action scripts committed without the executable bit:"
            echo "$bad"
            echo "Fix with: git update-index --chmod=+x <file>"
            exit 1
          fi
          echo "All action scripts are mode 100755."

      # #71: the reusable workflows must reach the commit-readme action by a @master ref.
      # A relative ./ path does not work there — it resolves against the CALLER's workspace
      # (proven by MRISS-Projects/dsh run 35463833006) — so the reference is qualified, and
      # a qualified reference carries a ref. Validating a change to the action requires
      # pointing that ref at a task branch; merging one would break every consumer's release
      # the moment the branch is deleted, silently and at release time. This fails the build
      # instead, so a task-branch pin cannot reach master.
      - name: Check the commit-readme action is pinned to master
        run: |
          set -euo pipefail
          # Matches only real 'uses:' lines, so this check does not flag its own pattern.
          # Trailing comments and surrounding quotes are stripped before comparing, so a
          # correctly pinned but quoted or annotated reference is not a false positive.
          bad=$(grep -rnE '^[[:space:]]*uses:[[:space:]]*.{0,2}\S*actions/commit-readme@' .github/workflows/ \
                | sed -e 's/[[:space:]]*#.*$//' -e "s/[\"']//g" -e 's/[[:space:]]*$//' \
                | grep -v '@master$' || true)
          if [ -n "$bad" ]; then
            echo "::error::commit-readme action pinned to a non-master ref:"
            echo "$bad"
            exit 1
          fi
          echo "All commit-readme references are pinned to @master."

      # Configure Maven settings so it can read from the GitHub Packages registry
      # (https://maven.pkg.github.com/MRISS-Projects/maven-repo) where
      # com.mriss:mriss-parent is hosted.
      #
      # Two things are required:
      # 1. <servers> — credentials.  GitHub Packages always requires authentication,
      #    even for public packages.  We use DEPLOY_TOKEN (a PAT with
      #    "read:packages" scope) rather than the auto-generated GITHUB_TOKEN,
      #    because GITHUB_TOKEN is scoped to THIS repository (parent-poms) only and
      #    cannot read packages published by a different repository (maven-repo).
      # 2. <profiles>/<repositories> — the registry URL, activated globally so Maven
      #    can locate parent POMs during multi-module initialisation, before any
      #    pom.xml <repositories> sections have been parsed.
      #
      # Maven resolves ${env.DEPLOY_TOKEN} and ${env.GITHUB_ACTOR} from the
      # process environment at build time; the token value is never written literally
      # into this file.
      - name: Configure Maven settings for GitHub Packages
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0
                                        https://maven.apache.org/xsd/settings-1.0.0.xsd">
              <servers>
                  <server>
                      <id>MRISS-Projects-maven-repo</id>
                      <username>${env.GITHUB_ACTOR}</username>
                      <password>${env.DEPLOY_TOKEN}</password>
                  </server>
                  <server>
                      <id>MRISS-Projects-maven-repo-plugins</id>
                      <username>${env.GITHUB_ACTOR}</username>
                      <password>${env.DEPLOY_TOKEN}</password>
                  </server>
                  <server>
                      <id>github.com</id>
                      <username>${env.GITHUB_ACTOR}</username>
                      <password>${env.DEPLOY_TOKEN}</password>
                  </server>
              </servers>
              <!--
                  Declare GitHub Packages as a repository in a settings profile so Maven can
                  resolve parent POMs (e.g. com.mriss:mriss-parent) from the registry during
                  multi-module build initialisation — before any pom.xml repository sections
                  are parsed.  Credentials are supplied by the <servers> block above using
                  DEPLOY_TOKEN (a cross-repository PAT).
              -->
              <profiles>
                  <profile>
                      <id>github-packages</id>
                      <properties>
                          <github.personal.token>${env.DEPLOY_TOKEN}</github.personal.token>
                      </properties>
                      <repositories>
                          <repository>
                              <id>MRISS-Projects-maven-repo</id>
                              <url>https://maven.pkg.github.com/MRISS-Projects/maven-repo</url>
                              <releases><enabled>true</enabled></releases>
                              <snapshots><enabled>true</enabled></snapshots>
                          </repository>
                      </repositories>
                      <pluginRepositories>
                          <pluginRepository>
                              <id>MRISS-Projects-maven-repo-plugins</id>
                              <url>https://maven.pkg.github.com/MRISS-Projects/maven-repo</url>
                              <releases><enabled>true</enabled></releases>
                              <snapshots><enabled>true</enabled></snapshots>
                          </pluginRepository>
                      </pluginRepositories>
                  </profile>
              </profiles>
              <activeProfiles>
                  <activeProfile>github-packages</activeProfile>
              </activeProfiles>
          </settings>
          EOF

      # Mirrors: mvn -U -B clean install (initial build from ReleaseJenkinsfile)
      - name: Build and Install
        run: mvn -B -U clean install

      # Mirrors: recursiveRelease -> mvn -Ddeployment deploy
      # FR004: replaced -P deployment with -Ddeployment (property-based activation)
      # to avoid Maven hierarchy interpolation/merge bugs.
      # Uses 'install' instead of 'deploy' to skip artifact publishing.
      # #71: -Dcommit.readme.phase=none is gone because there is no longer an scm:checkin
      # bound to the lifecycle for it to disarm. The README is regenerated in the working
      # tree and left uncommitted; nothing in this workflow commits it.
      - name: Build with Deployment Profile (no artifact publishing)
        run: mvn -B -Ddeployment -Dbuild.number=${GITHUB_RUN_NUMBER} install

      # Mirrors: recursiveRelease -> mvn -Ddeployment -Drelease-deployment site-deploy
      # FR004: replaced -P deployment,release-deployment with -Ddeployment -Drelease-deployment
      # Uses 'site' instead of 'site-deploy' to skip gh-pages publishing.
      # #71: see above — no commit.readme.phase override is needed any more.
      - name: Generate Site (no gh-pages publishing)
        run: mvn -B -Ddeployment -Drelease-deployment -Dsite.deployment.personal.main=file:///tmp/sites site
