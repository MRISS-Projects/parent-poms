name: Project Release

on:
  workflow_call:
    inputs:
      git_project:
        type: string
        required: true
        description: 'Target repository name, e.g. dsh'
      branch_name:
        type: string
        required: true
        description: 'RC branch name, e.g. staging-0.3.0-SNAPSHOT-RC'
      current_version:
        type: string
        required: true
        description: 'Release version (no -SNAPSHOT), e.g. 0.3.0'
      next_development_version:
        type: string
        required: true
        description: 'Next dev SNAPSHOT after release, e.g. 0.4.0-SNAPSHOT'
      hotfix_branch:
        type: string
        required: true
        description: 'Name of the hotfix branch to create, e.g. 0.3.x'
      initial_hotfix_version:
        type: string
        required: true
        description: 'Initial SNAPSHOT for hotfix branch, e.g. 0.3.1-SNAPSHOT'
      site_deployment_url:
        type: string
        required: false
        default: 'file:///tmp/sites'
        description: 'Site staging path. Must be file:///tmp/sites, the directory the site is verified in and published from; any other value fails the run before it writes anything'
      dry_run:
        type: boolean
        required: false
        default: false
        description: 'Rehearse the run: no remote write, every suppression announced'
      maven_properties:
        type: string
        required: false
        default: ''
        description: >-
          Build properties for this project, one `name=value` per line, rendered into
          the <properties> of the github-packages profile in the generated
          settings.xml. Empty leaves that file exactly as it is written.
      development_branch:
        type: string
        required: false
        default: 'DEVELOPMENT'
        description: 'Branch every release is merged back into, e.g. DEVELOP or DEVELOPMENT'
    secrets:
      DEPLOY_TOKEN:
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    # #106: one group per consumer, shared by project-staging.yml, project-release.yml and
    # project-hotfix.yml, because all three publish that consumer's site to the same gh-pages
    # branch. Keyed on git_project, not github.workflow: in a called workflow that is the
    # caller's name, so 'Staging' and 'Deploy Snapshot' would get separate groups and race.
    # Never cancel-in-progress: a run cancelled after its artifact deploy leaves a partial
    # deployment. queue: max keeps up to 100 waiting runs, and only a run beyond that is
    # cancelled; by default a newer one would cancel the one pending, and that could be a
    # release. A caller must not use <git_project>-site for a group of its own, at workflow or
    # job level: the called job would wait on its own caller.
    concurrency:
      group: ${{ inputs.git_project }}-site
      cancel-in-progress: false
      queue: max
    env:
      DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
      # #98: GitHub Packages answered one PUT of DSH 0.3.1's release:perform with a transient
      # 500, and the release stopped with its tag pushed and 12 of 13 modules published. The
      # resolver retries a failed request on its own, but by default only on 429 and 503. This
      # adds 500, 502 and 504, and allows five attempts. It is MAVEN_ARGS, not a -D on a
      # command: Maven's mvn script appends it to every invocation, and release:perform's
      # forked deploy inherits the environment, which a -D on the outer mvn never reaches.
      MAVEN_ARGS: >-
        -Daether.connector.http.retryHandler.serviceUnavailable=429,500,502,503,504
        -Daether.connector.http.retryHandler.count=5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: MRISS-Projects/${{ inputs.git_project }}
          ref: ${{ inputs.branch_name }}
          fetch-depth: 0
          token: ${{ secrets.DEPLOY_TOKEN }}

      # #72. Resolves dry_run into the RH_* variables the write points below interpolate,
      # installs the marker script, and snapshots the remote so the run can prove afterwards
      # that it changed nothing. Every RH_* variable is empty in a real release, so each
      # command below expands to exactly what it was before #72 — proven line by line in
      # specs/72-dry-run-release-workflows.md §8.
      - name: Rehearsal setup
        uses: MRISS-Projects/parent-poms/.github/actions/rehearsal-setup@master
        with:
          dry_run: ${{ inputs.dry_run }}
          git_project: ${{ inputs.git_project }}
          branch_name: ${{ inputs.branch_name }}
          token: ${{ secrets.DEPLOY_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Maven 3.9.16
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: '3.9.16'

      - name: Verify Maven version
        run: |
          mvn -version
          mvn -version | grep -qF 'Apache Maven 3.9.16 ' || {
            echo "::error::Expected Maven 3.9.16. The 'Set up Maven 3.9.16' step did not take effect, so this build would have run the runner image's Maven."
            exit 1
          }

      - name: Configure Maven settings
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'SETTINGS_EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0
                                        https://maven.apache.org/xsd/settings-1.0.0.xsd">
              <servers>
                  <server>
                      <id>releases</id>
                      <username>${env.GITHUB_ACTOR}</username>
                      <password>${env.DEPLOY_TOKEN}</password>
                  </server>
                  <server>
                      <id>MRISS-Projects-maven-repo</id>
                      <username>${env.GITHUB_ACTOR}</username>
                      <password>${env.DEPLOY_TOKEN}</password>
                  </server>
                  <server>
                      <id>MRISS-Projects-maven-repo-plugins</id>
                      <username>${env.GITHUB_ACTOR}</username>
                      <password>${env.DEPLOY_TOKEN}</password>
                  </server>
                  <server>
                      <id>github.com</id>
                      <username>${env.GITHUB_ACTOR}</username>
                      <password>${env.DEPLOY_TOKEN}</password>
                  </server>
                  <server>
                      <id>github</id>
                      <username>${env.GITHUB_ACTOR}</username>
                      <password>${env.DEPLOY_TOKEN}</password>
                  </server>
              </servers>
              <profiles>
                  <profile>
                      <id>github-packages</id>
                      <properties>
                          <github.personal.token>${env.DEPLOY_TOKEN}</github.personal.token>
                          <!-- MAVEN_PROPERTIES -->
                      </properties>
                      <repositories>
                          <repository>
                              <id>MRISS-Projects-maven-repo</id>
                              <url>https://maven.pkg.github.com/MRISS-Projects/maven-repo</url>
                              <releases><enabled>true</enabled></releases>
                              <snapshots><enabled>true</enabled></snapshots>
                          </repository>
                      </repositories>
                      <pluginRepositories>
                          <pluginRepository>
                              <id>MRISS-Projects-maven-repo-plugins</id>
                              <url>https://maven.pkg.github.com/MRISS-Projects/maven-repo</url>
                              <releases><enabled>true</enabled></releases>
                              <snapshots><enabled>true</enabled></snapshots>
                          </pluginRepository>
                      </pluginRepositories>
                  </profile>
              </profiles>
              <activeProfiles>
                  <activeProfile>github-packages</activeProfile>
              </activeProfiles>
          </settings>
          SETTINGS_EOF

      # #76: the heredoc above is quoted, so it cannot interpolate. The action replaces
      # the marker line inside <properties> with the consumer's own build properties,
      # and deletes it when there are none.
      - name: Render consumer Maven properties
        uses: MRISS-Projects/parent-poms/.github/actions/maven-properties@master
        with:
          properties: ${{ inputs.maven_properties }}

      - name: Configure Git
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      # #65: the merge-back is the last step of the run, so a missing development branch would
      # otherwise be discovered after the tag, the deploy, the master merge and the site. Here
      # it costs the first minute and nothing else. A read, so it runs the same in both modes.
      - name: Check the development branch exists
        env:
          DEVELOPMENT_BRANCH: ${{ inputs.development_branch }}
        run: |
          if ! git ls-remote --exit-code --heads origin "$DEVELOPMENT_BRANCH" > /dev/null; then
            echo "::error::development branch '$DEVELOPMENT_BRANCH' does not exist on the remote." \
                 "Pass development_branch from the calling workflow (dsh: DEVELOP)."
            exit 1
          fi

      # #88: the staged site is verified at /tmp/sites and published from /tmp/sites, because
      # the deployment profile's publish-scm execution fixes <content>/tmp/sites</content>
      # (root pom.xml). Any other site_deployment_url would stage the site in one directory
      # and publish another, so it is refused here, before the first write, rather than at
      # the verify step, which runs after the tag, the artifact deploy and the master merge.
      - name: Check the site staging path
        env:
          SITE_URL: ${{ inputs.site_deployment_url }}
        run: |
          if [ "${SITE_URL%/}" != "file:///tmp/sites" ]; then
            echo "::error::site_deployment_url is '$SITE_URL', but only file:///tmp/sites is" \
                 "supported: the site is published from /tmp/sites (publish-scm's <content>" \
                 "in parent-poms' root pom.xml)."
            exit 1
          fi

      - name: Validate version
        run: |
          FULL_VERSION=$(mvn -q help:evaluate -Dexpression=project.version -DforceStdout -N)
          IFS='.' read -r _ _ FIX <<< "${FULL_VERSION%-SNAPSHOT}"
          if [ "$FIX" != "0" ]; then
            echo "ERROR: project-release.yml is only for MAJOR.MINOR.0-SNAPSHOT versions."
            echo "       FIX component is '$FIX'. Use project-hotfix.yml for FIX > 0."
            exit 1
          fi

      # #81: every input reaches a run: body through env and is read quoted, never as a ${{ }}
      # in the script - see 'Checkout Hotfix Branch and Set Initial Version' for why. The
      # 'Check no run body interpolates an expression' step in build.yml enforces it.
      - name: Maven Release
        env:
          NEXT_DEVELOPMENT_VERSION: ${{ inputs.next_development_version }}
          CURRENT_VERSION: ${{ inputs.current_version }}
        run: |
          mvn -B \
            "-Dbuild.NEXT_DEVELOPMENT_VERSION=$NEXT_DEVELOPMENT_VERSION" \
            "-Dbuild.CURRENT_VERSION_NUMBER=$CURRENT_VERSION" \
            release:clean

          bash "$RUNNER_TEMP/rehearsal-marker.sh" release-prepare \
            "commit the release POMs, tag v$CURRENT_VERSION and push both"

          mvn -B $RH_RELEASE_DRYRUN \
            "-Dbuild.NEXT_DEVELOPMENT_VERSION=$NEXT_DEVELOPMENT_VERSION" \
            "-Dbuild.CURRENT_VERSION_NUMBER=$CURRENT_VERSION" \
            release:prepare

      # #72 §2.2 — the one rehearsal-only step. `release:prepare -DdryRun=true` creates no
      # tag and `release:perform -DdryRun=true` creates no target/checkout, so without this
      # every step below is unreachable rather than merely skipped, and #69's hotfix version
      # step and #65's merge-back would never execute. It builds both locally, out of the
      # pom.xml.tag tree the dry run already wrote to disk, and pushes nothing.
      #
      # IT RUNS BETWEEN prepare AND perform, which is the whole reason the Maven release is
      # two steps rather than one. `release:perform` finishes with release:clean — "done
      # automatically after a successful release:perform", per that goal's own description —
      # and it does so in dry run too. MRISS-Projects/dsh run 35661237973 logged "Cleaning up
      # after release..." and the bridge, then placed after the whole thing, found
      # release.properties and all 13 pom.xml.tag files already deleted.
      #
      # Nothing the bridge produces is at risk from that cleanup: the tag is a git ref, and
      # target/checkout survives for the same reason a real release's does — perform creates
      # it, cleans, and the next step cd's into it.
      - name: Rehearsal tag bridge
        if: ${{ inputs.dry_run }}
        uses: MRISS-Projects/parent-poms/.github/actions/rehearsal-tag@master
        with:
          site_deployment_url: ${{ inputs.site_deployment_url }}

      - name: Maven Release Perform
        env:
          SITE_URL: ${{ inputs.site_deployment_url }}
        run: |
          bash "$RUNNER_TEMP/rehearsal-marker.sh" release-perform-deploy \
            "check out the tag and deploy the artifacts to the registry"

          # #95: prepare's fork is the release's only test run. perform builds the tag prepare
          # just tested, so it swaps products/pom.xml's -DintegrationTests default for
          # -DskipTests. Replacing it, not adding to it, keeps the integration-test profile —
          # and whatever a product starts under it — out of perform. Inert under a parent
          # older than 3.9.2, which does not interpolate the property.
          mvn -B $RH_RELEASE_DRYRUN \
            -Dsite.deployment.personal.main="${SITE_URL}" \
            -Drelease.forked.test.arguments=-DskipTests \
            release:perform

      - name: Create Hotfix Branch
        env:
          HOTFIX_BRANCH: ${{ inputs.hotfix_branch }}
        run: |
          cd target/checkout
          bash "$RUNNER_TEMP/rehearsal-marker.sh" scm-branch \
            "push the new hotfix branch $HOTFIX_BRANCH to the remote"
          mvn -B $RH_SCM_LOCAL_URL "-Dbranch=$HOTFIX_BRANCH" scm:branch

      - name: Checkout Hotfix Branch and Set Initial Version
        # PR #80 review: a ${{ }} expression is substituted into the script TEXT before bash
        # parses it, so a dispatch input reaching a `run:` body directly is a command-injection
        # vector — `0.3.1-SNAPSHOT; touch ./PWNED #` ran the touch, and its trailing `#` ate the
        # Maven goal, so the step would also have gone green having set no versions at all.
        # Through `env` the same payload is inert data: one argument Maven then rejects.
        # Dispatching needs write access, so this is hardening rather than an open door, but the
        # job carries contents:write, packages:write and DEPLOY_TOKEN.
        env:
          INITIAL_HOTFIX_VERSION: ${{ inputs.initial_hotfix_version }}
          HOTFIX_BRANCH: ${{ inputs.hotfix_branch }}
        run: |
          rm -rf target/checkout

          # scm:checkout is a read, so it gets the redirected URL but no marker: under a
          # rehearsal the hotfix branch exists only in the workspace repository, which is
          # where the redirected scm:branch above just pushed it.
          mvn -B $RH_SCM_LOCAL_URL \
            "-DscmVersion=$HOTFIX_BRANCH" \
            -DscmVersionType=branch \
            -DcheckoutDirectory=target/checkout \
            scm:checkout

          cd target/checkout

          # #69: `versions:set -DprocessAllModules=true` rewrote the root POM and nothing else —
          # measured at 1 of 13 on the dsh reactor (run 35662168807), and neither a flag nor a
          # plugin-version problem: -DgroupId='*' -DartifactId='*' -DoldVersion='*' and
          # versions-maven-plugin 2.20.0 both reproduce it. It is an aggregator goal; it computes
          # the change for every module and writes one file.
          #
          # release:update-versions reaches all 13, driven through build.NEXT_DEVELOPMENT_VERSION.
          # pom.xml:375 binds <developmentVersion> to that property, so a -D resolves it and it
          # becomes the default development version for EVERY project in the reactor. It is a POM
          # interpolation variable, not a plugin parameter's user property, which is why the
          # "<configuration> beats the user property" trap does not apply to it — unlike
          # -DdevelopmentVersion, which that same binding does render inert.
          #
          # -Dproject.dev.<groupId>:<artifactId> was tried first and is WRONG here, subtly: it
          # moves the root and nothing else, and the other twelve modules are then moved by the
          # release plugin's default version policy, which increments each module's own version.
          # -DautoVersionSubmodules=true does not save it, because the plugin takes that path only
          # when the root is a SNAPSHOT and this checkout is the release tag. The two agree only
          # when initial_hotfix_version happens to equal MAJOR.MINOR.(FIX+1)-SNAPSHOT of the
          # release, which is what made the first measurement of this look correct. Asking for
          # 0.9.9-SNAPSHOT off 0.3.0 instead produced a mixed reactor AND rewrote nine
          # ${project.version} references in the root to a hardcoded 0.3.1-SNAPSHOT.
          # See specs/69-set-hotfix-version-on-every-module.md §2.2.
          mvn -B "-Dbuild.NEXT_DEVELOPMENT_VERSION=$INITIAL_HOTFIX_VERSION" \
            release:update-versions

      # #69: nothing upstream of this catches a wrong version here. A rehearsal will not: the
      # bridge installs the release-version artifacts locally (rehearsal-tag/action.yml), so a
      # stale parent resolves and scm:checkin succeeds. A real release will not either: by this
      # point release:perform has deployed them, so the hotfix line just quietly starts at the
      # version it was branched from. Hence a POSITIVE assertion, in both modes — the absence of
      # an error proves nothing here. It replaces the rehearsal-only evidence line #72 added to
      # measure this issue, and it has already earned its keep: it is what caught the
      # project.dev.<g>:<a> defect described in the previous step's comment.
      - name: Verify every module carries the hotfix version
        uses: MRISS-Projects/parent-poms/.github/actions/verify-reactor-version@master
        with:
          expected-version: ${{ inputs.initial_hotfix_version }}
          working-directory: target/checkout

      # A composite action cannot run inside a `run:` block and the assertion must sit between
      # the version change and the commit, so the step is split. A `cd` does not survive a step
      # boundary; this one re-enters the checkout.
      - name: Commit the Hotfix Version
        # Same reasoning as the step above. The -Dmessage value expands byte for byte to what it
        # was, which the global constraint on the commit message requires.
        env:
          INITIAL_HOTFIX_VERSION: ${{ inputs.initial_hotfix_version }}
          HOTFIX_BRANCH: ${{ inputs.hotfix_branch }}
        run: |
          cd target/checkout

          bash "$RUNNER_TEMP/rehearsal-marker.sh" scm-checkin-hotfix-version \
            "push the $INITIAL_HOTFIX_VERSION version change to $HOTFIX_BRANCH"

          mvn -B $RH_SCM_LOCAL_URL "-Dmessage=[maven-release-plugin] set hotfix version $INITIAL_HOTFIX_VERSION" scm:checkin

      - name: Merge Release Tag to Master
        env:
          CURRENT_TAG: v${{ inputs.current_version }}
          GIT_PROJECT: ${{ inputs.git_project }}
        run: |
          REPO_URL="https://x-access-token:${DEPLOY_TOKEN}@github.com/MRISS-Projects/${GIT_PROJECT}.git"

          rm -rf target/checkout

          git clone --branch master "$REPO_URL" target/checkout

          cd target/checkout

          # RH_TAG_SOURCE is the one flag variable that is non-empty in a real release: it
          # holds the literal 'origin' this line used to hardcode, so the expansion is
          # unchanged. Under a rehearsal it names the workspace, where the bridge built the
          # tag — the remote does not have it and must not.
          git fetch $RH_TAG_SOURCE "refs/tags/${CURRENT_TAG}:refs/tags/${CURRENT_TAG}"

          # The merge itself runs for real in both modes. It is a local operation, and it is
          # the operation #65 is about, so suppressing it would defeat the rehearsal.
          git merge -s recursive -X theirs "$CURRENT_TAG"

          bash "$RUNNER_TEMP/rehearsal-marker.sh" merge-to-master \
            "push the merge of ${CURRENT_TAG} to master"

          git push $RH_GIT_PUSH_DRYRUN "$REPO_URL" master

      # #95/#96: build the site where release:prepare's fork ran the tests: this workspace.
      # target/checkout is a fresh master clone with no test output, which is what published
      # empty reports and no badge. Checking the tag out moves only tracked files; every
      # target/ is ignored and keeps prepare's surefire/failsafe results, jacoco*.exec and
      # the badge. The tag is local in both modes: prepare created it, or, in a rehearsal,
      # the tag bridge did. Nothing since prepare has touched this workspace's tracked files:
      # every step in between works in target/checkout. The tag comes through env, not a
      # ${{ }} in the script, for the reason given at 'Checkout Hotfix Branch'.
      #
      # #88: staging, verifying and publishing the site are three steps, not one site-deploy.
      # The deployment profile binds scm-publish:publish-scm to the site-deploy phase of every
      # module, so a single site-deploy pushed to gh-pages once per module, the root first,
      # and left no point at which the staged site could be looked at before it was public.
      # -Dscmpublish.skipDeploy=true makes each module's publish-scm skip itself: site:deploy
      # still fills /tmp/sites, and nothing reaches the remote, in a real run as in a rehearsal.
      - name: Stage the Site
        env:
          RELEASE_TAG: v${{ inputs.current_version }}
          SITE_URL: ${{ inputs.site_deployment_url }}
        run: |
          git checkout --quiet --detach "$RELEASE_TAG"
          mvn -B \
            -Dsite.deployment.personal.main="${SITE_URL}" \
            -Ddeployment \
            -Drelease-deployment \
            -Dscmpublish.skipDeploy=true \
            site-deploy

      - name: Verify every staged module site has an index.html
        uses: MRISS-Projects/parent-poms/.github/actions/verify-staged-site@master

      # publish-scm is an aggregator goal, so it runs once, from the root (-N). The
      # @publish-to-github suffix makes Maven use the deployment profile's own execution
      # configuration (content, scmBranch, pubScmUrl, serverId). This is the one remote
      # write of the three steps, so the rehearsal marker and the dry-run flag live here.
      - name: Deploy Site to gh-pages
        run: |
          bash "$RUNNER_TEMP/rehearsal-marker.sh" site-deploy \
            "publish the generated site to gh-pages"
          mvn -B -N $RH_SCMPUBLISH_DRYRUN \
            -Ddeployment \
            -Drelease-deployment \
            scm-publish:publish-scm@publish-to-github

      # #71: generation and committing are now two steps. Generation stays in Maven via the
      # inherited readme-generation profile; the commit is a workflow step so a forked
      # lifecycle cannot replay it. target/checkout is a git clone rather than an
      # actions/checkout workspace, so it has no persisted credentials and needs push-url.
      - name: Generate README.md on Master
        run: |
          cd target/checkout
          mvn -B \
            -Ddeployment \
            -Drelease-deployment \
            process-resources

      - name: Commit generated README.md on Master
        uses: MRISS-Projects/parent-poms/.github/actions/commit-readme@master
        with:
          branch: master
          working-directory: target/checkout
          push-url: https://x-access-token:${{ secrets.DEPLOY_TOKEN }}@github.com/MRISS-Projects/${{ inputs.git_project }}.git
          dry-run: ${{ inputs.dry_run }}

      - name: Remove RC Branch
        env:
          GIT_PROJECT: ${{ inputs.git_project }}
          BRANCH_NAME: ${{ inputs.branch_name }}
        run: |
          REPO_URL="https://x-access-token:${DEPLOY_TOKEN}@github.com/MRISS-Projects/${GIT_PROJECT}.git"
          bash "$RUNNER_TEMP/rehearsal-marker.sh" remove-rc-branch \
            "delete the RC branch $BRANCH_NAME from the remote"
          # Verified against a scratch repository rather than assumed: --delete changes the
          # refspec shape, and --dry-run still prints " - [deleted] <branch>" while leaving
          # the ref in place. That printed line is precisely why the marker above exists
          # instead of trusting git's own output.
          git push $RH_GIT_PUSH_DRYRUN "$REPO_URL" --delete "$BRANCH_NAME"

      # #65: carry the release into the development branch, which keeps its own version.
      # Last on purpose: if a real conflict stops it, the release is already complete and only
      # a merge a human can finish from the tag is missing. Deleting the RC branch first loses
      # nothing: the tag holds its content, and the next-development commit left on it changes
      # only versions, which the alignment recomputes from the development branch.
      # See specs/65-merge-release-back-into-develop.md §3.4.
      - name: Merge Release Tag to Development Branch
        uses: MRISS-Projects/parent-poms/.github/actions/merge-to-develop@master
        with:
          tag: v${{ inputs.current_version }}
          development_branch: ${{ inputs.development_branch }}
          git_project: ${{ inputs.git_project }}
          token: ${{ secrets.DEPLOY_TOKEN }}

      # if: always() — a rehearsal that dies halfway is exactly when you need to know
      # whether it wrote something first.
      - name: Rehearsal verify
        if: always()
        uses: MRISS-Projects/parent-poms/.github/actions/rehearsal-verify@master
        with:
          dry_run: ${{ inputs.dry_run }}
          git_project: ${{ inputs.git_project }}
          current_version: ${{ inputs.current_version }}
          dispatch_branch: ${{ inputs.branch_name }}
          hotfix_branch: ${{ inputs.hotfix_branch }}
          token: ${{ secrets.DEPLOY_TOKEN }}
          # Set equality is enforced against this list, so a write point added without a
          # marker becomes a build failure. #65's merge-to-develop is the ninth.
          declared_markers: >-
            release-prepare
            release-perform-deploy
            scm-branch
            scm-checkin-hotfix-version
            merge-to-master
            site-deploy
            commit-readme
            remove-rc-branch
            merge-to-develop
