name: Project Release

on:
  workflow_call:
    inputs:
      git_project:
        type: string
        required: true
        description: 'Target repository name, e.g. dsh'
      branch_name:
        type: string
        required: true
        description: 'RC branch name, e.g. staging-0.3.0-SNAPSHOT-RC'
      current_version:
        type: string
        required: true
        description: 'Release version (no -SNAPSHOT), e.g. 0.3.0'
      next_development_version:
        type: string
        required: true
        description: 'Next dev SNAPSHOT after release, e.g. 0.4.0-SNAPSHOT'
      hotfix_branch:
        type: string
        required: true
        description: 'Name of the hotfix branch to create, e.g. 0.3.x'
      initial_hotfix_version:
        type: string
        required: true
        description: 'Initial SNAPSHOT for hotfix branch, e.g. 0.3.1-SNAPSHOT'
      site_deployment_url:
        type: string
        required: false
        default: 'file:///tmp/sites'
        description: 'Site staging path. Default: file:///tmp/sites'
      dry_run:
        type: boolean
        required: false
        default: false
        description: 'Rehearse the run: no remote write, every suppression announced'
    secrets:
      DEPLOY_TOKEN:
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    concurrency:
      group: ${{ github.workflow }}-${{ inputs.git_project }}-release
      cancel-in-progress: false
    env:
      DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: MRISS-Projects/${{ inputs.git_project }}
          ref: ${{ inputs.branch_name }}
          fetch-depth: 0
          token: ${{ secrets.DEPLOY_TOKEN }}

      # #72. Resolves dry_run into the RH_* variables the write points below interpolate,
      # installs the marker script, and snapshots the remote so the run can prove afterwards
      # that it changed nothing. Every RH_* variable is empty in a real release, so each
      # command below expands to exactly what it was before #72 — proven line by line in
      # specs/72-dry-run-release-workflows.md §8.
      - name: Rehearsal setup
        uses: MRISS-Projects/parent-poms/.github/actions/rehearsal-setup@master
        with:
          dry_run: ${{ inputs.dry_run }}
          git_project: ${{ inputs.git_project }}
          branch_name: ${{ inputs.branch_name }}
          token: ${{ secrets.DEPLOY_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Maven 3.9.9
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: '3.9.9'

      - name: Configure Maven settings
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'SETTINGS_EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0
                                        https://maven.apache.org/xsd/settings-1.0.0.xsd">
              <servers>
                  <server>
                      <id>releases</id>
                      <username>${env.GITHUB_ACTOR}</username>
                      <password>${env.DEPLOY_TOKEN}</password>
                  </server>
                  <server>
                      <id>MRISS-Projects-maven-repo</id>
                      <username>${env.GITHUB_ACTOR}</username>
                      <password>${env.DEPLOY_TOKEN}</password>
                  </server>
                  <server>
                      <id>MRISS-Projects-maven-repo-plugins</id>
                      <username>${env.GITHUB_ACTOR}</username>
                      <password>${env.DEPLOY_TOKEN}</password>
                  </server>
                  <server>
                      <id>github.com</id>
                      <username>${env.GITHUB_ACTOR}</username>
                      <password>${env.DEPLOY_TOKEN}</password>
                  </server>
                  <server>
                      <id>github</id>
                      <username>${env.GITHUB_ACTOR}</username>
                      <password>${env.DEPLOY_TOKEN}</password>
                  </server>
              </servers>
              <profiles>
                  <profile>
                      <id>github-packages</id>
                      <properties>
                          <github.personal.token>${env.DEPLOY_TOKEN}</github.personal.token>
                      </properties>
                      <repositories>
                          <repository>
                              <id>MRISS-Projects-maven-repo</id>
                              <url>https://maven.pkg.github.com/MRISS-Projects/maven-repo</url>
                              <releases><enabled>true</enabled></releases>
                              <snapshots><enabled>true</enabled></snapshots>
                          </repository>
                      </repositories>
                      <pluginRepositories>
                          <pluginRepository>
                              <id>MRISS-Projects-maven-repo-plugins</id>
                              <url>https://maven.pkg.github.com/MRISS-Projects/maven-repo</url>
                              <releases><enabled>true</enabled></releases>
                              <snapshots><enabled>true</enabled></snapshots>
                          </pluginRepository>
                      </pluginRepositories>
                  </profile>
              </profiles>
              <activeProfiles>
                  <activeProfile>github-packages</activeProfile>
              </activeProfiles>
          </settings>
          SETTINGS_EOF

      - name: Configure Git
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Validate version
        run: |
          FULL_VERSION=$(mvn -q help:evaluate -Dexpression=project.version -DforceStdout -N)
          IFS='.' read -r _ _ FIX <<< "${FULL_VERSION%-SNAPSHOT}"
          if [ "$FIX" != "0" ]; then
            echo "ERROR: project-release.yml is only for MAJOR.MINOR.0-SNAPSHOT versions."
            echo "       FIX component is '$FIX'. Use project-hotfix.yml for FIX > 0."
            exit 1
          fi

      - name: Maven Release
        run: |
          SITE_URL="${{ inputs.site_deployment_url }}"

          mvn -B \
            -Dbuild.NEXT_DEVELOPMENT_VERSION=${{ inputs.next_development_version }} \
            -Dbuild.CURRENT_VERSION_NUMBER=${{ inputs.current_version }} \
            release:clean

          bash "$RUNNER_TEMP/rehearsal-marker.sh" release-prepare \
            "commit the release POMs, tag v${{ inputs.current_version }} and push both"

          mvn -B $RH_RELEASE_DRYRUN \
            -Dbuild.NEXT_DEVELOPMENT_VERSION=${{ inputs.next_development_version }} \
            -Dbuild.CURRENT_VERSION_NUMBER=${{ inputs.current_version }} \
            release:prepare

          bash "$RUNNER_TEMP/rehearsal-marker.sh" release-perform-deploy \
            "check out the tag and deploy the artifacts to the registry"

          mvn -B $RH_RELEASE_DRYRUN \
            -Dsite.deployment.personal.main="${SITE_URL}" \
            release:perform

      # #72 §2.2 — the one rehearsal-only step. `release:prepare -DdryRun=true` creates no
      # tag and `release:perform -DdryRun=true` creates no target/checkout, so without this
      # every step below is unreachable rather than merely skipped, and #69's versions:set
      # and #65's merge-back would never execute. It builds both locally, out of the
      # pom.xml.tag tree the dry run already wrote to disk, and pushes nothing.
      - name: Rehearsal tag bridge
        if: ${{ inputs.dry_run }}
        uses: MRISS-Projects/parent-poms/.github/actions/rehearsal-tag@master

      - name: Create Hotfix Branch
        run: |
          cd target/checkout
          bash "$RUNNER_TEMP/rehearsal-marker.sh" scm-branch \
            "push the new hotfix branch ${{ inputs.hotfix_branch }} to the remote"
          mvn -B $RH_SCM_LOCAL_URL -Dbranch=${{ inputs.hotfix_branch }} scm:branch

      - name: Checkout Hotfix Branch and Set Initial Version
        run: |
          rm -rf target/checkout

          # scm:checkout is a read, so it gets the redirected URL but no marker: under a
          # rehearsal the hotfix branch exists only in the workspace repository, which is
          # where the redirected scm:branch above just pushed it.
          mvn -B $RH_SCM_LOCAL_URL \
            -DscmVersion=${{ inputs.hotfix_branch }} \
            -DscmVersionType=branch \
            -DcheckoutDirectory=target/checkout \
            scm:checkout

          cd target/checkout

          mvn -B -DprocessAllModules=true -DnewVersion=${{ inputs.initial_hotfix_version }} versions:set

          # #69's question, answered by the run rather than by reading the plugin: does
          # versions:set -DprocessAllModules=true rewrite one POM or all of them? #69's
          # analysis predicts 1 of 13. Rehearsal-only, because in a real release this
          # directory is a fresh checkout whose diff is the same measurement but whose log
          # nobody reads.
          if [ -n "${RH_ACTIVE:-}" ]; then
            modified=$(git status --porcelain '*pom.xml' | wc -l)
            total=$(git ls-files '*pom.xml' | wc -l)
            echo "REHEARSAL evidence for #69: versions:set modified ${modified} of ${total} pom.xml file(s)."
            git status --porcelain '*pom.xml'
            {
              echo "- **#69 evidence** — \`versions:set -DprocessAllModules=true\` modified" \
                   "\`${modified}\` of \`${total}\` POM files."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          bash "$RUNNER_TEMP/rehearsal-marker.sh" scm-checkin-hotfix-version \
            "push the ${{ inputs.initial_hotfix_version }} version change to ${{ inputs.hotfix_branch }}"

          mvn -B $RH_SCM_LOCAL_URL -Dmessage="[maven-release-plugin] set hotfix version ${{ inputs.initial_hotfix_version }}" scm:checkin

      - name: Merge Release Tag to Master
        run: |
          CURRENT_TAG="v${{ inputs.current_version }}"
          REPO_URL="https://x-access-token:${DEPLOY_TOKEN}@github.com/MRISS-Projects/${{ inputs.git_project }}.git"

          rm -rf target/checkout

          git clone --branch master "$REPO_URL" target/checkout

          cd target/checkout

          # RH_TAG_SOURCE is the one flag variable that is non-empty in a real release: it
          # holds the literal 'origin' this line used to hardcode, so the expansion is
          # unchanged. Under a rehearsal it names the workspace, where the bridge built the
          # tag — the remote does not have it and must not.
          git fetch $RH_TAG_SOURCE "refs/tags/${CURRENT_TAG}:refs/tags/${CURRENT_TAG}"

          # The merge itself runs for real in both modes. It is a local operation, and it is
          # the operation #65 is about, so suppressing it would defeat the rehearsal.
          git merge -s recursive -X theirs "$CURRENT_TAG"

          bash "$RUNNER_TEMP/rehearsal-marker.sh" merge-to-master \
            "push the merge of ${CURRENT_TAG} to master"

          git push $RH_GIT_PUSH_DRYRUN "$REPO_URL" master

      - name: Deploy Site to gh-pages
        run: |
          cd target/checkout
          bash "$RUNNER_TEMP/rehearsal-marker.sh" site-deploy \
            "publish the generated site to gh-pages"
          mvn -B $RH_SCMPUBLISH_DRYRUN \
            -Dsite.deployment.personal.main="${{ inputs.site_deployment_url }}" \
            -Ddeployment \
            -Drelease-deployment \
            site-deploy

      # #71: generation and committing are now two steps. Generation stays in Maven via the
      # inherited readme-generation profile; the commit is a workflow step so a forked
      # lifecycle cannot replay it. target/checkout is a git clone rather than an
      # actions/checkout workspace, so it has no persisted credentials and needs push-url.
      - name: Generate README.md on Master
        run: |
          cd target/checkout
          mvn -B \
            -Ddeployment \
            -Drelease-deployment \
            process-resources

      - name: Commit generated README.md on Master
        uses: MRISS-Projects/parent-poms/.github/actions/commit-readme@master
        with:
          branch: master
          working-directory: target/checkout
          push-url: https://x-access-token:${{ secrets.DEPLOY_TOKEN }}@github.com/MRISS-Projects/${{ inputs.git_project }}.git
          dry-run: ${{ inputs.dry_run }}

      - name: Remove RC Branch
        run: |
          REPO_URL="https://x-access-token:${DEPLOY_TOKEN}@github.com/MRISS-Projects/${{ inputs.git_project }}.git"
          bash "$RUNNER_TEMP/rehearsal-marker.sh" remove-rc-branch \
            "delete the RC branch ${{ inputs.branch_name }} from the remote"
          # Verified against a scratch repository rather than assumed: --delete changes the
          # refspec shape, and --dry-run still prints " - [deleted] <branch>" while leaving
          # the ref in place. That printed line is precisely why the marker above exists
          # instead of trusting git's own output.
          git push $RH_GIT_PUSH_DRYRUN "$REPO_URL" --delete ${{ inputs.branch_name }}

      # if: always() — a rehearsal that dies halfway is exactly when you need to know
      # whether it wrote something first.
      - name: Rehearsal verify
        if: always()
        uses: MRISS-Projects/parent-poms/.github/actions/rehearsal-verify@master
        with:
          dry_run: ${{ inputs.dry_run }}
          git_project: ${{ inputs.git_project }}
          current_version: ${{ inputs.current_version }}
          dispatch_branch: ${{ inputs.branch_name }}
          hotfix_branch: ${{ inputs.hotfix_branch }}
          token: ${{ secrets.DEPLOY_TOKEN }}
          # Set equality is enforced against this list. When #65 adds the merge into
          # DEVELOP, its marker id must be added here or the rehearsal fails — which is the
          # point: a write point added without a marker becomes a build failure.
          declared_markers: >-
            release-prepare
            release-perform-deploy
            scm-branch
            scm-checkin-hotfix-version
            merge-to-master
            site-deploy
            commit-readme
            remove-rc-branch
