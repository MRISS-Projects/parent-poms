name: Rehearsal Probe

# TEMPORARY — MRISS-Projects/parent-poms#72, Task 1.
#
# Measures phases 11-17 of `release:prepare -DdryRun=true`, which specs/72 §1.4 could not
# measure locally: the local probe died at phase 10 resolving surefire-shared-utils from a
# `central` that returned `Connection reset`. This runs the identical command in CI, where
# the reactor builds, and answers three questions:
#
#   1. Do scm-commit-release, scm-tag and scm-commit-development log the git command they skip?
#   2. Does rewrite-poms-for-development write pom.xml.next files?
#   3. What is the wall time of run-preparation-goals (`clean install` across 13 modules)?
#
# Deleted in the commit that writes the answers into specs/72-dry-run-release-workflows.md.
#
# Trigger note: `workflow_dispatch` only reaches a workflow that exists on the default
# branch, and this one deliberately never lands there. The `push` trigger with a `paths`
# filter runs it from the branch that carries it, exactly once per push that touches it.

on:
  workflow_dispatch:
  push:
    branches:
      - issue-72-dry-run-release-workflows
    paths:
      - '.github/workflows/rehearsal-probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
    steps:
      - name: Checkout dsh at the RC branch
        uses: actions/checkout@v4
        with:
          repository: MRISS-Projects/dsh
          ref: staging-0.3.0-SNAPSHOT-RC
          fetch-depth: 0
          token: ${{ secrets.DEPLOY_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Maven 3.9.9
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: '3.9.9'

      - name: Configure Maven settings
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'SETTINGS_EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0
                                        https://maven.apache.org/xsd/settings-1.0.0.xsd">
              <servers>
                  <server>
                      <id>MRISS-Projects-maven-repo</id>
                      <username>${env.GITHUB_ACTOR}</username>
                      <password>${env.DEPLOY_TOKEN}</password>
                  </server>
                  <server>
                      <id>MRISS-Projects-maven-repo-plugins</id>
                      <username>${env.GITHUB_ACTOR}</username>
                      <password>${env.DEPLOY_TOKEN}</password>
                  </server>
              </servers>
              <profiles>
                  <profile>
                      <id>github-packages</id>
                      <properties>
                          <github.personal.token>${env.DEPLOY_TOKEN}</github.personal.token>
                      </properties>
                      <repositories>
                          <repository>
                              <id>MRISS-Projects-maven-repo</id>
                              <url>https://maven.pkg.github.com/MRISS-Projects/maven-repo</url>
                              <releases><enabled>true</enabled></releases>
                              <snapshots><enabled>true</enabled></snapshots>
                          </repository>
                      </repositories>
                      <pluginRepositories>
                          <pluginRepository>
                              <id>MRISS-Projects-maven-repo-plugins</id>
                              <url>https://maven.pkg.github.com/MRISS-Projects/maven-repo</url>
                              <releases><enabled>true</enabled></releases>
                              <snapshots><enabled>true</enabled></snapshots>
                          </pluginRepository>
                      </pluginRepositories>
                  </profile>
              </profiles>
              <activeProfiles>
                  <activeProfile>github-packages</activeProfile>
              </activeProfiles>
          </settings>
          SETTINGS_EOF

      - name: Configure Git
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Dry-run release:prepare
        run: |
          set -o pipefail
          echo "PROBE-START $(date -u +%FT%TZ)"
          # Byte-identical to the command in specs/72 §1, so the CI measurement extends the
          # local one rather than replacing it with a different experiment.
          mvn -B -DdryRun=true \
            -Dbuild.CURRENT_VERSION_NUMBER=0.3.0 \
            -Dbuild.NEXT_DEVELOPMENT_VERSION=0.4.0-SNAPSHOT \
            release:prepare 2>&1 | tee prepare.log
          echo "PROBE-END $(date -u +%FT%TZ)"

      - name: Findings
        if: always()
        run: |
          echo "=== phase markers, with timestamps from the -B log where present ==="
          grep -nE 'phases:|Checking in modified POMs|Tagging release|scm-commit|scm-tag|Executing: /bin/sh|Working directory' prepare.log \
            | tail -80 || true

          echo
          echo "=== git commands the plugin echoed (dry run logs them rather than running them) ==="
          grep -nE 'Executing: .*git ' prepare.log || echo "(none — the plugin logged no git command)"

          echo
          echo "=== pom.xml.tag files ==="
          find . -name 'pom.xml.tag' -not -path './target/*' | sort
          find . -name 'pom.xml.tag' -not -path './target/*' | wc -l | sed 's/^/count: /'

          echo
          echo "=== pom.xml.next files ==="
          if find . -name 'pom.xml.next' -not -path './target/*' | sort | grep -q .; then
            find . -name 'pom.xml.next' -not -path './target/*' | sort
            find . -name 'pom.xml.next' -not -path './target/*' | wc -l | sed 's/^/count: /'
          else
            echo "(none — rewrite-poms-for-development wrote no .next files)"
          fi

          echo
          echo "=== release.properties ==="
          if [ -f release.properties ]; then
            grep -E '^(scm\.tag|completedPhase|preparationGoals|exec\.|project\.(rel|dev)\.)' release.properties | sort
          else
            echo "(absent)"
          fi

          echo
          echo "=== working tree after the dry run ==="
          git status --porcelain | head -60
          echo "root pom version: $(grep -m2 '<version>' pom.xml | tail -1)"

      - name: Upload the raw log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rehearsal-probe-prepare-log
          path: prepare.log
          retention-days: 7
