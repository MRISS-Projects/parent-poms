name: Project Hotfix

on:
  workflow_call:
    inputs:
      git_project:
        type: string
        required: true
        description: 'Target repository name, e.g. dsh'
      branch_name:
        type: string
        required: true
        description: 'Hotfix branch name, e.g. 0.3.x'
      site_deployment_url:
        type: string
        required: false
        default: 'file:///tmp/sites'
        description: 'Site staging path. Default: file:///tmp/sites'
      dry_run:
        type: boolean
        required: false
        default: false
        description: 'Rehearse the run: no remote write, every suppression announced'
    secrets:
      DEPLOY_TOKEN:
        required: true

jobs:
  hotfix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    concurrency:
      group: ${{ github.workflow }}-${{ inputs.git_project }}-hotfix
      cancel-in-progress: false
    env:
      DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: MRISS-Projects/${{ inputs.git_project }}
          ref: ${{ inputs.branch_name }}
          fetch-depth: 0
          token: ${{ secrets.DEPLOY_TOKEN }}

      # #72. See the identical step in project-release.yml. Every RH_* variable is empty in
      # a real hotfix, so each command below expands to exactly what it was before #72.
      - name: Rehearsal setup
        uses: MRISS-Projects/parent-poms/.github/actions/rehearsal-setup@master
        with:
          dry_run: ${{ inputs.dry_run }}
          git_project: ${{ inputs.git_project }}
          branch_name: ${{ inputs.branch_name }}
          token: ${{ secrets.DEPLOY_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Maven 3.9.9
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: '3.9.9'

      - name: Configure Maven settings
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'SETTINGS_EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0
                                        https://maven.apache.org/xsd/settings-1.0.0.xsd">
              <servers>
                  <server>
                      <id>releases</id>
                      <username>${env.GITHUB_ACTOR}</username>
                      <password>${env.DEPLOY_TOKEN}</password>
                  </server>
                  <server>
                      <id>MRISS-Projects-maven-repo</id>
                      <username>${env.GITHUB_ACTOR}</username>
                      <password>${env.DEPLOY_TOKEN}</password>
                  </server>
                  <server>
                      <id>MRISS-Projects-maven-repo-plugins</id>
                      <username>${env.GITHUB_ACTOR}</username>
                      <password>${env.DEPLOY_TOKEN}</password>
                  </server>
                  <server>
                      <id>github.com</id>
                      <username>${env.GITHUB_ACTOR}</username>
                      <password>${env.DEPLOY_TOKEN}</password>
                  </server>
                  <server>
                      <id>github</id>
                      <username>${env.GITHUB_ACTOR}</username>
                      <password>${env.DEPLOY_TOKEN}</password>
                  </server>
              </servers>
              <profiles>
                  <profile>
                      <id>github-packages</id>
                      <properties>
                          <github.personal.token>${env.DEPLOY_TOKEN}</github.personal.token>
                      </properties>
                      <repositories>
                          <repository>
                              <id>MRISS-Projects-maven-repo</id>
                              <url>https://maven.pkg.github.com/MRISS-Projects/maven-repo</url>
                              <releases><enabled>true</enabled></releases>
                              <snapshots><enabled>true</enabled></snapshots>
                          </repository>
                      </repositories>
                      <pluginRepositories>
                          <pluginRepository>
                              <id>MRISS-Projects-maven-repo-plugins</id>
                              <url>https://maven.pkg.github.com/MRISS-Projects/maven-repo</url>
                              <releases><enabled>true</enabled></releases>
                              <snapshots><enabled>true</enabled></snapshots>
                          </pluginRepository>
                      </pluginRepositories>
                  </profile>
              </profiles>
              <activeProfiles>
                  <activeProfile>github-packages</activeProfile>
              </activeProfiles>
          </settings>
          SETTINGS_EOF

      - name: Configure Git
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Read hotfix release number
        run: |
          HOTFIX_RELEASE_NUMBER=$(mvn -q help:evaluate -Dexpression=project.version -DforceStdout -N \
            | sed 's/-SNAPSHOT//')
          echo "HOTFIX_RELEASE_NUMBER=${HOTFIX_RELEASE_NUMBER}" >> $GITHUB_ENV

      - name: Validate version
        run: |
          FULL_VERSION=$(mvn -q help:evaluate -Dexpression=project.version -DforceStdout -N)
          IFS='.' read -r _ _ FIX_PART <<< "${FULL_VERSION%-SNAPSHOT}"
          if [ "$FIX_PART" = "0" ]; then
            echo "ERROR: project-hotfix.yml is only for MAJOR.MINOR.FIX-SNAPSHOT where FIX > 0."
            echo "       FIX component is '0'. Use project-release.yml for MAJOR.MINOR.0 releases."
            exit 1
          fi

      - name: Maven Release
        run: |
          mvn -B release:clean

          bash "$RUNNER_TEMP/rehearsal-marker.sh" release-prepare \
            "commit the release POMs, tag v${HOTFIX_RELEASE_NUMBER} and push both"

          mvn -B $RH_RELEASE_DRYRUN release:prepare

          bash "$RUNNER_TEMP/rehearsal-marker.sh" release-perform-deploy \
            "check out the tag and deploy the artifacts to the registry"

          mvn -B $RH_RELEASE_DRYRUN \
            -Dsite.deployment.personal.main="${{ inputs.site_deployment_url }}" \
            release:perform

      # #72 §2.2 — the one rehearsal-only step. See project-release.yml for why it exists.
      - name: Rehearsal tag bridge
        if: ${{ inputs.dry_run }}
        uses: MRISS-Projects/parent-poms/.github/actions/rehearsal-tag@master

      - name: Merge Release Tag to Master
        run: |
          CURRENT_TAG="v${HOTFIX_RELEASE_NUMBER}"
          REPO_URL="https://x-access-token:${DEPLOY_TOKEN}@github.com/MRISS-Projects/${{ inputs.git_project }}.git"

          rm -rf target/checkout

          git clone --branch master "$REPO_URL" target/checkout

          cd target/checkout

          # See project-release.yml: RH_TAG_SOURCE holds the literal 'origin' this line used
          # to hardcode, so a real hotfix's expansion is unchanged.
          git fetch $RH_TAG_SOURCE "refs/tags/${CURRENT_TAG}:refs/tags/${CURRENT_TAG}"

          # --allow-unrelated-histories is this workflow's own and stays: a hotfix line can
          # be cut from a tag whose history master does not contain.
          git merge -s recursive -X theirs --allow-unrelated-histories "$CURRENT_TAG"

          bash "$RUNNER_TEMP/rehearsal-marker.sh" merge-to-master \
            "push the merge of ${CURRENT_TAG} to master"

          git push $RH_GIT_PUSH_DRYRUN "$REPO_URL" master

      - name: Deploy Site to gh-pages
        run: |
          cd target/checkout
          bash "$RUNNER_TEMP/rehearsal-marker.sh" site-deploy \
            "publish the generated site to gh-pages"
          mvn -B $RH_SCMPUBLISH_DRYRUN \
            -Dsite.deployment.personal.main="${{ inputs.site_deployment_url }}" \
            -Ddeployment \
            -Drelease-deployment \
            site-deploy

      # #71: generation and committing are now two steps. Generation stays in Maven via the
      # inherited readme-generation profile; the commit is a workflow step so a forked
      # lifecycle cannot replay it. target/checkout is a git clone rather than an
      # actions/checkout workspace, so it has no persisted credentials and needs push-url.
      - name: Generate README.md on Master
        run: |
          cd target/checkout
          mvn -B \
            -Ddeployment \
            -Drelease-deployment \
            process-resources

      - name: Commit generated README.md on Master
        uses: MRISS-Projects/parent-poms/.github/actions/commit-readme@master
        with:
          branch: master
          working-directory: target/checkout
          push-url: https://x-access-token:${{ secrets.DEPLOY_TOKEN }}@github.com/MRISS-Projects/${{ inputs.git_project }}.git
          dry-run: ${{ inputs.dry_run }}

      - name: Rehearsal verify
        if: always()
        uses: MRISS-Projects/parent-poms/.github/actions/rehearsal-verify@master
        with:
          dry_run: ${{ inputs.dry_run }}
          git_project: ${{ inputs.git_project }}
          # Read by the 'Read hotfix release number' step above. This workflow takes no
          # version input; the version it releases is whatever the branch's POM says.
          current_version: ${{ env.HOTFIX_RELEASE_NUMBER }}
          dispatch_branch: ${{ inputs.branch_name }}
          # Empty: project-hotfix.yml creates no branch, so there is none to assert absent.
          hotfix_branch: ''
          token: ${{ secrets.DEPLOY_TOKEN }}
          # Five, not eight: no scm:branch, no versions:set checkin, no RC deletion.
          declared_markers: >-
            release-prepare
            release-perform-deploy
            merge-to-master
            site-deploy
            commit-readme
