name: Project Hotfix

on:
  workflow_call:
    inputs:
      git_project:
        type: string
        required: true
        description: 'Target repository name, e.g. dsh'
      branch_name:
        type: string
        required: true
        description: 'Hotfix branch name, e.g. 0.3.x'
      site_deployment_url:
        type: string
        required: false
        default: 'file:///tmp/sites'
        description: 'Site staging path. Must be file:///tmp/sites, the directory the site is verified in and published from; any other value fails the run before it writes anything'
      dry_run:
        type: boolean
        required: false
        default: false
        description: 'Rehearse the run: no remote write, every suppression announced'
      maven_properties:
        type: string
        required: false
        default: ''
        description: >-
          Build properties for this project, one `name=value` per line, rendered into
          the <properties> of the github-packages profile in the generated
          settings.xml. Empty leaves that file exactly as it is written.
      development_branch:
        type: string
        required: false
        default: 'DEVELOPMENT'
        description: 'Branch every release is merged back into, e.g. DEVELOP or DEVELOPMENT'
    secrets:
      DEPLOY_TOKEN:
        required: true

jobs:
  hotfix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    # #106: one group per consumer, shared by project-staging.yml, project-release.yml and
    # project-hotfix.yml, because all three publish that consumer's site to the same gh-pages
    # branch. Keyed on git_project, not github.workflow: in a called workflow that is the
    # caller's name, so 'Staging' and 'Deploy Snapshot' would get separate groups and race.
    # Never cancel-in-progress: a run cancelled after its artifact deploy leaves a partial
    # deployment. queue: max keeps up to 100 waiting runs, and only a run beyond that is
    # cancelled; by default a newer one would cancel the one pending, and that could be a
    # release. A caller must not use <git_project>-site for a group of its own, at workflow or
    # job level: the called job would wait on its own caller.
    concurrency:
      group: ${{ inputs.git_project }}-site
      cancel-in-progress: false
      queue: max
    env:
      DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
      # #98: GitHub Packages answered one PUT of DSH 0.3.1's release:perform with a transient
      # 500, and the release stopped with its tag pushed and 12 of 13 modules published. The
      # resolver retries a failed request on its own, but by default only on 429 and 503. This
      # adds 500, 502 and 504, and allows five attempts. It is MAVEN_ARGS, not a -D on a
      # command: Maven's mvn script appends it to every invocation, and release:perform's
      # forked deploy inherits the environment, which a -D on the outer mvn never reaches.
      MAVEN_ARGS: >-
        -Daether.connector.http.retryHandler.serviceUnavailable=429,500,502,503,504
        -Daether.connector.http.retryHandler.count=5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: MRISS-Projects/${{ inputs.git_project }}
          ref: ${{ inputs.branch_name }}
          fetch-depth: 0
          token: ${{ secrets.DEPLOY_TOKEN }}

      # #72. See the identical step in project-release.yml. Every RH_* variable is empty in
      # a real hotfix, so each command below expands to exactly what it was before #72.
      - name: Rehearsal setup
        uses: MRISS-Projects/parent-poms/.github/actions/rehearsal-setup@master
        with:
          dry_run: ${{ inputs.dry_run }}
          git_project: ${{ inputs.git_project }}
          branch_name: ${{ inputs.branch_name }}
          token: ${{ secrets.DEPLOY_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Maven 3.9.16
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: '3.9.16'

      - name: Verify Maven version
        run: |
          mvn -version
          mvn -version | grep -qF 'Apache Maven 3.9.16 ' || {
            echo "::error::Expected Maven 3.9.16. The 'Set up Maven 3.9.16' step did not take effect, so this build would have run the runner image's Maven."
            exit 1
          }

      - name: Configure Maven settings
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'SETTINGS_EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0
                                        https://maven.apache.org/xsd/settings-1.0.0.xsd">
              <servers>
                  <server>
                      <id>releases</id>
                      <username>${env.GITHUB_ACTOR}</username>
                      <password>${env.DEPLOY_TOKEN}</password>
                  </server>
                  <server>
                      <id>MRISS-Projects-maven-repo</id>
                      <username>${env.GITHUB_ACTOR}</username>
                      <password>${env.DEPLOY_TOKEN}</password>
                  </server>
                  <server>
                      <id>MRISS-Projects-maven-repo-plugins</id>
                      <username>${env.GITHUB_ACTOR}</username>
                      <password>${env.DEPLOY_TOKEN}</password>
                  </server>
                  <server>
                      <id>github.com</id>
                      <username>${env.GITHUB_ACTOR}</username>
                      <password>${env.DEPLOY_TOKEN}</password>
                  </server>
                  <server>
                      <id>github</id>
                      <username>${env.GITHUB_ACTOR}</username>
                      <password>${env.DEPLOY_TOKEN}</password>
                  </server>
              </servers>
              <profiles>
                  <profile>
                      <id>github-packages</id>
                      <properties>
                          <github.personal.token>${env.DEPLOY_TOKEN}</github.personal.token>
                          <!-- MAVEN_PROPERTIES -->
                      </properties>
                      <repositories>
                          <repository>
                              <id>MRISS-Projects-maven-repo</id>
                              <url>https://maven.pkg.github.com/MRISS-Projects/maven-repo</url>
                              <releases><enabled>true</enabled></releases>
                              <snapshots><enabled>true</enabled></snapshots>
                          </repository>
                      </repositories>
                      <pluginRepositories>
                          <pluginRepository>
                              <id>MRISS-Projects-maven-repo-plugins</id>
                              <url>https://maven.pkg.github.com/MRISS-Projects/maven-repo</url>
                              <releases><enabled>true</enabled></releases>
                              <snapshots><enabled>true</enabled></snapshots>
                          </pluginRepository>
                      </pluginRepositories>
                  </profile>
              </profiles>
              <activeProfiles>
                  <activeProfile>github-packages</activeProfile>
              </activeProfiles>
          </settings>
          SETTINGS_EOF

      # #76: the heredoc above is quoted, so it cannot interpolate. The action replaces
      # the marker line inside <properties> with the consumer's own build properties,
      # and deletes it when there are none.
      - name: Render consumer Maven properties
        uses: MRISS-Projects/parent-poms/.github/actions/maven-properties@master
        with:
          properties: ${{ inputs.maven_properties }}

      - name: Configure Git
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      # #65: see the identical step in project-release.yml.
      - name: Check the development branch exists
        env:
          DEVELOPMENT_BRANCH: ${{ inputs.development_branch }}
        run: |
          if ! git ls-remote --exit-code --heads origin "$DEVELOPMENT_BRANCH" > /dev/null; then
            echo "::error::development branch '$DEVELOPMENT_BRANCH' does not exist on the remote." \
                 "Pass development_branch from the calling workflow (dsh: DEVELOP)."
            exit 1
          fi

      - name: Read hotfix release number
        run: |
          HOTFIX_RELEASE_NUMBER=$(mvn -q help:evaluate -Dexpression=project.version -DforceStdout -N \
            | sed 's/-SNAPSHOT//')
          echo "HOTFIX_RELEASE_NUMBER=${HOTFIX_RELEASE_NUMBER}" >> $GITHUB_ENV

      # #88: the staged site is verified at /tmp/sites and published from /tmp/sites, because
      # the deployment profile's publish-scm execution fixes <content>/tmp/sites</content>
      # (root pom.xml). Any other site_deployment_url would stage the site in one directory
      # and publish another, so it is refused here, before the first write, rather than at
      # the verify step, which runs after the tag, the artifact deploy and the master merge.
      - name: Check the site staging path
        env:
          SITE_URL: ${{ inputs.site_deployment_url }}
        run: |
          if [ "${SITE_URL%/}" != "file:///tmp/sites" ]; then
            echo "::error::site_deployment_url is '$SITE_URL', but only file:///tmp/sites is" \
                 "supported: the site is published from /tmp/sites (publish-scm's <content>" \
                 "in parent-poms' root pom.xml)."
            exit 1
          fi

      - name: Validate version
        run: |
          FULL_VERSION=$(mvn -q help:evaluate -Dexpression=project.version -DforceStdout -N)
          IFS='.' read -r _ _ FIX_PART <<< "${FULL_VERSION%-SNAPSHOT}"
          if [ "$FIX_PART" = "0" ]; then
            echo "ERROR: project-hotfix.yml is only for MAJOR.MINOR.FIX-SNAPSHOT where FIX > 0."
            echo "       FIX component is '0'. Use project-release.yml for MAJOR.MINOR.0 releases."
            exit 1
          fi

      - name: Maven Release
        run: |
          mvn -B release:clean

          bash "$RUNNER_TEMP/rehearsal-marker.sh" release-prepare \
            "commit the release POMs, tag v${HOTFIX_RELEASE_NUMBER} and push both"

          mvn -B $RH_RELEASE_DRYRUN release:prepare

      # #72 §2.2 — the one rehearsal-only step. See project-release.yml for why it exists,
      # and for why it must sit between prepare and perform rather than after both.
      - name: Rehearsal tag bridge
        if: ${{ inputs.dry_run }}
        uses: MRISS-Projects/parent-poms/.github/actions/rehearsal-tag@master
        with:
          site_deployment_url: ${{ inputs.site_deployment_url }}

      # #81: every input reaches a run: body through env and is read quoted, never as a ${{ }}
      # in the script. The 'Check no run body interpolates an expression' step in build.yml
      # enforces it; project-release.yml's 'Checkout Hotfix Branch and Set Initial Version'
      # has the reason.
      - name: Maven Release Perform
        env:
          SITE_URL: ${{ inputs.site_deployment_url }}
        run: |
          bash "$RUNNER_TEMP/rehearsal-marker.sh" release-perform-deploy \
            "check out the tag and deploy the artifacts to the registry"

          # #95: prepare's fork is the release's only test run. perform builds the tag prepare
          # just tested, so it swaps products/pom.xml's -DintegrationTests default for
          # -DskipTests. Replacing it, not adding to it, keeps the integration-test profile —
          # and whatever a product starts under it — out of perform. Inert under a parent
          # older than 3.9.2, which does not interpolate the property.
          mvn -B $RH_RELEASE_DRYRUN \
            -Dsite.deployment.personal.main="${SITE_URL}" \
            -Drelease.forked.test.arguments=-DskipTests \
            release:perform

      - name: Merge Release Tag to Master
        env:
          GIT_PROJECT: ${{ inputs.git_project }}
        run: |
          CURRENT_TAG="v${HOTFIX_RELEASE_NUMBER}"
          REPO_URL="https://x-access-token:${DEPLOY_TOKEN}@github.com/MRISS-Projects/${GIT_PROJECT}.git"

          rm -rf target/checkout

          git clone --branch master "$REPO_URL" target/checkout

          cd target/checkout

          # See project-release.yml: RH_TAG_SOURCE holds the literal 'origin' this line used
          # to hardcode, so a real hotfix's expansion is unchanged.
          git fetch $RH_TAG_SOURCE "refs/tags/${CURRENT_TAG}:refs/tags/${CURRENT_TAG}"

          # --allow-unrelated-histories is this workflow's own and stays: a hotfix line can
          # be cut from a tag whose history master does not contain.
          git merge -s recursive -X theirs --allow-unrelated-histories "$CURRENT_TAG"

          bash "$RUNNER_TEMP/rehearsal-marker.sh" merge-to-master \
            "push the merge of ${CURRENT_TAG} to master"

          git push $RH_GIT_PUSH_DRYRUN "$REPO_URL" master

      # #95/#96: build the site where release:prepare's fork ran the tests: this workspace.
      # target/checkout is a fresh master clone with no test output, which is what published
      # empty reports and no badge. Checking the tag out moves only tracked files; every
      # target/ is ignored and keeps prepare's surefire/failsafe results, jacoco*.exec and
      # the badge. The tag is local in both modes: prepare created it, or, in a rehearsal,
      # the tag bridge did. Nothing since prepare has touched this workspace's tracked files.
      #
      # #88: staging, verifying and publishing the site are three steps, not one site-deploy;
      # project-release.yml's 'Stage the Site' has the reason. -Dscmpublish.skipDeploy=true
      # makes each module's publish-scm skip itself, so nothing reaches the remote here.
      - name: Stage the Site
        env:
          SITE_URL: ${{ inputs.site_deployment_url }}
        run: |
          git checkout --quiet --detach "v${HOTFIX_RELEASE_NUMBER}"
          mvn -B \
            -Dsite.deployment.personal.main="${SITE_URL}" \
            -Ddeployment \
            -Drelease-deployment \
            -Dscmpublish.skipDeploy=true \
            site-deploy

      - name: Verify every staged module site has an index.html
        uses: MRISS-Projects/parent-poms/.github/actions/verify-staged-site@master

      # One publish for the whole site, from the root. This is the one remote write of the
      # three steps, so the rehearsal marker and the dry-run flag live here.
      - name: Deploy Site to gh-pages
        run: |
          bash "$RUNNER_TEMP/rehearsal-marker.sh" site-deploy \
            "publish the generated site to gh-pages"
          mvn -B -N $RH_SCMPUBLISH_DRYRUN \
            -Ddeployment \
            -Drelease-deployment \
            scm-publish:publish-scm@publish-to-github

      # #71: generation and committing are now two steps. Generation stays in Maven via the
      # inherited readme-generation profile; the commit is a workflow step so a forked
      # lifecycle cannot replay it. target/checkout is a git clone rather than an
      # actions/checkout workspace, so it has no persisted credentials and needs push-url.
      - name: Generate README.md on Master
        run: |
          cd target/checkout
          mvn -B \
            -Ddeployment \
            -Drelease-deployment \
            process-resources

      - name: Commit generated README.md on Master
        uses: MRISS-Projects/parent-poms/.github/actions/commit-readme@master
        with:
          branch: master
          working-directory: target/checkout
          push-url: https://x-access-token:${{ secrets.DEPLOY_TOKEN }}@github.com/MRISS-Projects/${{ inputs.git_project }}.git
          dry-run: ${{ inputs.dry_run }}

      # #65: see the identical step in project-release.yml. A hotfix's fixes reach the
      # development branch the same way a release's do. The master merge's
      # --allow-unrelated-histories is deliberately not carried over: a hotfix tag with no
      # history in common with the development branch is for a human to merge, and the
      # merge-back says so rather than forcing it. specs/65 §3.5.
      - name: Merge Release Tag to Development Branch
        uses: MRISS-Projects/parent-poms/.github/actions/merge-to-develop@master
        with:
          tag: v${{ env.HOTFIX_RELEASE_NUMBER }}
          development_branch: ${{ inputs.development_branch }}
          git_project: ${{ inputs.git_project }}
          token: ${{ secrets.DEPLOY_TOKEN }}

      - name: Rehearsal verify
        if: always()
        uses: MRISS-Projects/parent-poms/.github/actions/rehearsal-verify@master
        with:
          dry_run: ${{ inputs.dry_run }}
          git_project: ${{ inputs.git_project }}
          # Read by the 'Read hotfix release number' step above. This workflow takes no
          # version input; the version it releases is whatever the branch's POM says.
          current_version: ${{ env.HOTFIX_RELEASE_NUMBER }}
          dispatch_branch: ${{ inputs.branch_name }}
          # Empty: project-hotfix.yml creates no branch, so there is none to assert absent.
          hotfix_branch: ''
          token: ${{ secrets.DEPLOY_TOKEN }}
          # Six, not nine: no scm:branch, no versions:set checkin, no RC deletion.
          declared_markers: >-
            release-prepare
            release-perform-deploy
            merge-to-master
            site-deploy
            commit-readme
            merge-to-develop
