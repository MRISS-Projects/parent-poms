name: Project Staging

on:
  workflow_call:
    inputs:
      git_project:
        type: string
        required: true
        description: 'Target repository name, e.g. dsh'
      branch_name:
        type: string
        required: true
        description: >-
          The branch to build and publish: an RC branch for release_type 'rcs', e.g.
          staging-0.3.0-SNAPSHOT-RC, or a development branch for 'snapshots'.
      release_type:
        type: string
        required: false
        default: 'rcs'
        description: >-
          'rcs' stages a release candidate: the site goes under rcs/ and the build number is
          RC<n>. 'snapshots' deploys a development snapshot: the site goes under snapshots/ and
          the build number is <n>. Any other value fails the run before it writes anything.
      appengine_project_version:
        type: string
        required: false
        default: ''
        description: 'GCP App Engine version suffix (empty = skip flag)'
      cloudrun_project_version:
        type: string
        required: false
        default: ''
        description: 'GCP Cloud Run version suffix (empty = skip flag)'
      build_number:
        type: string
        required: false
        default: ''
        description: 'Build number; resolved to RC<n> for rcs, and to <n> for snapshots, in step'
      maven_properties:
        type: string
        required: false
        default: ''
        description: >-
          Build properties for this project, one `name=value` per line, rendered into
          the <properties> of the github-packages profile in the generated
          settings.xml. Empty leaves that file exactly as it is written.
    secrets:
      DEPLOY_TOKEN:
        required: true
      GCLOUD_PROJECT_ID:
        required: false

jobs:
  staging:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    # #106: one group per consumer, shared by project-staging.yml, project-release.yml and
    # project-hotfix.yml, because all three publish that consumer's site to the same gh-pages
    # branch. Keyed on git_project, not github.workflow: in a called workflow that is the
    # caller's name, so 'Staging' and 'Deploy Snapshot' would get separate groups and race.
    # Never cancel-in-progress: a run cancelled after its artifact deploy leaves a partial
    # deployment. queue: max keeps every waiting run; by default a newer one would cancel the
    # one pending, and that could be a release. A caller must not use <git_project>-site for a
    # group of its own, at workflow or job level: the called job would wait on its own caller.
    concurrency:
      group: ${{ inputs.git_project }}-site
      cancel-in-progress: false
      queue: max
    env:
      DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: MRISS-Projects/${{ inputs.git_project }}
          ref: ${{ inputs.branch_name }}
          fetch-depth: 0
          token: ${{ secrets.DEPLOY_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Maven 3.9.16
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: '3.9.16'

      - name: Verify Maven version
        run: |
          mvn -version
          mvn -version | grep -qF 'Apache Maven 3.9.16 ' || {
            echo "::error::Expected Maven 3.9.16. The 'Set up Maven 3.9.16' step did not take effect, so this build would have run the runner image's Maven."
            exit 1
          }

      - name: Configure Maven settings
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'SETTINGS_EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0
                                        https://maven.apache.org/xsd/settings-1.0.0.xsd">
              <servers>
                  <server>
                      <id>releases</id>
                      <username>${env.GITHUB_ACTOR}</username>
                      <password>${env.DEPLOY_TOKEN}</password>
                  </server>
                  <server>
                      <id>MRISS-Projects-maven-repo</id>
                      <username>${env.GITHUB_ACTOR}</username>
                      <password>${env.DEPLOY_TOKEN}</password>
                  </server>
                  <server>
                      <id>MRISS-Projects-maven-repo-plugins</id>
                      <username>${env.GITHUB_ACTOR}</username>
                      <password>${env.DEPLOY_TOKEN}</password>
                  </server>
                  <server>
                      <id>github.com</id>
                      <username>${env.GITHUB_ACTOR}</username>
                      <password>${env.DEPLOY_TOKEN}</password>
                  </server>
                  <server>
                      <id>github</id>
                      <username>${env.GITHUB_ACTOR}</username>
                      <password>${env.DEPLOY_TOKEN}</password>
                  </server>
              </servers>
              <profiles>
                  <profile>
                      <id>github-packages</id>
                      <properties>
                          <github.personal.token>${env.DEPLOY_TOKEN}</github.personal.token>
                          <!-- MAVEN_PROPERTIES -->
                      </properties>
                      <repositories>
                          <repository>
                              <id>MRISS-Projects-maven-repo</id>
                              <url>https://maven.pkg.github.com/MRISS-Projects/maven-repo</url>
                              <releases><enabled>true</enabled></releases>
                              <snapshots><enabled>true</enabled></snapshots>
                          </repository>
                      </repositories>
                      <pluginRepositories>
                          <pluginRepository>
                              <id>MRISS-Projects-maven-repo-plugins</id>
                              <url>https://maven.pkg.github.com/MRISS-Projects/maven-repo</url>
                              <releases><enabled>true</enabled></releases>
                              <snapshots><enabled>true</enabled></snapshots>
                          </pluginRepository>
                      </pluginRepositories>
                  </profile>
              </profiles>
              <activeProfiles>
                  <activeProfile>github-packages</activeProfile>
              </activeProfiles>
          </settings>
          SETTINGS_EOF

      # #76: the heredoc above is quoted, so it cannot interpolate. The action replaces
      # the marker line inside <properties> with the consumer's own build properties,
      # and deletes it when there are none.
      - name: Render consumer Maven properties
        uses: MRISS-Projects/parent-poms/.github/actions/maven-properties@master
        with:
          properties: ${{ inputs.maven_properties }}

      - name: Configure Git
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      # #104: release_type picks what this workflow deploys. 'rcs', the default, is a release
      # candidate: -Drelease.type=rcs and a build number of RC<n>, as this workflow always did.
      # 'snapshots' is a development snapshot: -Drelease.type=snapshots and a plain <n>, which
      # is what this repository's own deploy.yml passes. A workflow_call input cannot be a
      # choice, so the two values are enforced here, before the first write.
      - name: Check the release type
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          case "$RELEASE_TYPE" in
            rcs|snapshots) ;;
            *)
              echo "::error::release_type is '$RELEASE_TYPE', but only 'rcs' and 'snapshots'" \
                   "are supported."
              exit 1
              ;;
          esac

      # #81: inputs reach the script through env and are read quoted, never as a ${{ }} in the
      # body; the 'Check no run body interpolates an expression' step in build.yml enforces it.
      # GCP_FLAGS is an array so that each flag stays one argument: the string it used to be
      # was expanded unquoted, and would have split a value at any space.
      - name: Build and Deploy Staging Artifacts
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          APPENGINE_PROJECT_VERSION: ${{ inputs.appengine_project_version }}
          CLOUDRUN_PROJECT_VERSION: ${{ inputs.cloudrun_project_version }}
        run: |
          BUILD_NUM="${BUILD_NUMBER:-${GITHUB_RUN_NUMBER}}"
          if [ "$RELEASE_TYPE" = "rcs" ]; then
            BUILD_NUM="RC${BUILD_NUM}"
          fi

          GCP_FLAGS=()
          if [ -n "$APPENGINE_PROJECT_VERSION" ]; then
            GCP_FLAGS+=("-Dappengine.project.version=$APPENGINE_PROJECT_VERSION")
          fi
          if [ -n "$CLOUDRUN_PROJECT_VERSION" ]; then
            GCP_FLAGS+=("-Dcloudrun.project.version=$CLOUDRUN_PROJECT_VERSION")
          fi

          set +e
          output=$(mvn -B -U \
            -Ddeployment \
            -DintegrationTests \
            "-Drelease.type=$RELEASE_TYPE" \
            "-Dbuild.number=${BUILD_NUM}" \
            "${GCP_FLAGS[@]}" \
            clean deploy 2>&1)
          rc=$?
          echo "$output"
          if [ $rc -ne 0 ]; then
            if echo "$output" | grep -qE "status code: 409|HTTP 409|Conflict \(409\)"; then
              echo "WARNING: Artifact already exists (409 Conflict). Continuing."
            else
              exit $rc
            fi
          fi
          set -e

      # #71: an early copy of the guard that also runs at commit time. The build above has
      # already regenerated README.md, so an unresolved placeholder is detectable here —
      # before the site is published. This matters because generate-list-of-issues is
      # configured failOnError=false (root pom.xml), so a GitHub API hiccup, an expired token
      # or a missing milestone leaves ${issues.text.list} literal without failing the build.
      # Without this step the run would go red only at the commit, after artifacts AND the
      # site were published, with no way to finish. Failing here leaves only the artifact
      # deploy done, which is re-runnable (the 409 handling above makes it idempotent).
      - name: Verify the generated README before publishing
        uses: MRISS-Projects/parent-poms/.github/actions/commit-readme@master
        with:
          branch: ${{ inputs.branch_name }}
          verify-only: 'true'

      # #88: staging, verifying and publishing the site are three steps, not one site-deploy.
      # The deployment profile binds scm-publish:publish-scm to the site-deploy phase of every
      # module, so a single site-deploy pushed to gh-pages once per module, the root first,
      # and left no point at which the staged site could be looked at before it was public.
      # MRISS-Projects/dsh#90 published 2,600+ files with no index.html in any module that way.
      #
      # -Dscmpublish.skipDeploy=true makes each module's publish-scm skip itself: site:deploy
      # still fills /tmp/sites, and nothing reaches the remote.
      - name: Stage the Staging Site
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          BUILD_NUM="${BUILD_NUMBER:-${GITHUB_RUN_NUMBER}}"
          if [ "$RELEASE_TYPE" = "rcs" ]; then
            BUILD_NUM="RC${BUILD_NUM}"
          fi

          mvn -B -U \
            -Ddeployment \
            "-Drelease.type=$RELEASE_TYPE" \
            "-Dbuild.number=${BUILD_NUM}" \
            -Dsite.deployment.personal.main=file:///tmp/sites \
            -Dscmpublish.skipDeploy=true \
            site-deploy

      - name: Verify every staged module site has an index.html
        uses: MRISS-Projects/parent-poms/.github/actions/verify-staged-site@master

      # publish-scm is an aggregator goal, so it runs once, from the root (-N). The
      # @publish-to-github suffix makes Maven use the deployment profile's own execution
      # configuration (content, scmBranch, pubScmUrl, serverId), so none of it is restated
      # here. One push for the whole site, where there used to be one per module.
      - name: Publish the Staging Site to gh-pages
        run: |
          mvn -B -N \
            -Ddeployment \
            scm-publish:publish-scm@publish-to-github

      # #71: the README is generated by the inherited readme-generation profile but
      # committed here, once, rather than by an scm:checkin inside process-resources that a
      # forked lifecycle replayed four times. The workspace was checked out with a token, so
      # credentials are persisted and pushing to origin works.
      - name: Commit generated README.md
        uses: MRISS-Projects/parent-poms/.github/actions/commit-readme@master
        with:
          branch: ${{ inputs.branch_name }}
